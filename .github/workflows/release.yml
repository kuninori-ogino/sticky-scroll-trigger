name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  # Lets `npm publish` authenticate via OIDC instead of a stored token, once this repo and
  # workflow file are registered as the package's trusted publisher on npmjs.com.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - run: npm ci

      # Releases only after confirming the tag name (vX.Y.Z) matches package.json's version.
      - name: Check tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build:lib

      # Trusted publishing requires npm 11.5.1+; the version bundled with .nvmrc's Node isn't
      # guaranteed to be new enough, so this updates npm itself before publishing.
      - run: npm install -g npm@latest

      # No token needed: with `id-token: write` above and this repo/workflow registered as the
      # package's trusted publisher on npmjs.com, npm authenticates via OIDC automatically.
      - name: Publish to npm
        run: npm publish

      # If the zip's timestamp were the CI run time, a rebuild would produce a diff, so this
      # matches it to the tag's commit date instead. Keeping the UTC extended timestamp (the UT
      # extra field) lets whoever unzips it see it correctly converted to their own local
      # timezone, so there's no need to do the timezone conversion manually here.
      - name: Archive dist
        run: |
          COMMIT_DATE="$(git log -1 --format=%cI "${GITHUB_REF_NAME}")"
          find dist -exec touch -d "$COMMIT_DATE" {} +
          cd dist
          zip -r ../sticky-scroll-trigger-dist.zip .

      # git log would mix in version-bump and CI-tweak commits, so this uses CHANGELOG.md's
      # matching version section as-is instead.
      - name: Generate release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No section for ${VERSION} found in CHANGELOG.md"
            exit 1
          fi

      - name: Create GitHub Release and attach dist
        uses: softprops/action-gh-release@v3
        with:
          files: sticky-scroll-trigger-dist.zip
          body_path: release-notes.md
