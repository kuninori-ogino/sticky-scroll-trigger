<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>pinKillRemeasure fixture</title>
    <style>
      body {
        margin: 0;
      }
      /* .lead's own margin-bottom and .pin's margin-top collapse into a single 60px gap, wrapped
         as unwrapped, so killing the pin moves nothing. */
      .lead {
        height: 100px;
        margin-bottom: 60px;
      }
      .pin {
        height: 300px;
        margin-top: 40px;
      }
      .scene {
        height: 400px;
      }
      .tail {
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div class="root">
      <div class="lead"></div>
      <div class="pin"></div>
      <section class="scene"></section>
    </div>
    <div class="tail"></div>

    <script type="module">
      import gsap from 'gsap';
      import { ScrollTrigger } from 'gsap/ScrollTrigger';
      import StickyScrollTrigger from '../../src/index.ts';

      gsap.registerPlugin(ScrollTrigger);

      const sticky = new StickyScrollTrigger('.root');

      // .pin sits right before .scene in DOM order. Its wrappers reserve the room it takes,
      // margins included, so .scene's freeze window stays where it was through the kill.
      const sceneVars = sticky.createStickyTrigger({ trigger: '.scene', start: 'top top', end: '+=200' });
      const pinVars = sticky.createStickyPin({ trigger: '.pin', endTrigger: '.tail', end: 'top top' });

      const sceneTrigger = ScrollTrigger.create(sceneVars);
      const pinTrigger = ScrollTrigger.create(pinVars);

      sticky.refresh();
      ScrollTrigger.refresh();

      // snapshot() reads GSAP's own cached start alongside the module's, since only a static
      // refresh after the kill keeps the two in step (the same pairing batchKill.html checks
      // for a Scene kill).
      const snapshot = () => ({ module: sceneVars.start(), gsap: sceneTrigger.start });

      // grow: makes .pin taller after the last refresh(), which its wrapper still reserves the old
      // height for, so the kill moves .scene by the difference.
      window.__runPinKill = async (grow = 0) => {
        const before = snapshot();

        if (grow) pinVars.trigger.style.height = `${300 + grow}px`;

        pinTrigger.kill();

        // Long enough for the microtask the kill schedules, plus GSAP's own refresh after it.
        await new Promise((resolve) => setTimeout(resolve, 50));

        return { before, after: snapshot() };
      };
    </script>
  </body>
</html>
