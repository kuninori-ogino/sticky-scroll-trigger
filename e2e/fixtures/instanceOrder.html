<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>instanceOrder fixture</title>
    <style>
      body {
        margin: 0;
      }
      section {
        display: block;
        height: 400px;
      }
      .pin {
        height: 300px;
      }
    </style>
  </head>
  <body>
    <div style="height: 200px"></div>
    <div class="top"></div>
    <div class="bottom"></div>
    <div class="tail"></div>
    <script type="module">
      import gsap from 'gsap';
      import { ScrollTrigger } from 'gsap/ScrollTrigger';
      import StickyScrollTrigger from '../../src/index.ts';

      gsap.registerPlugin(ScrollTrigger);

      // Two instances, one above the other, whose GSAP refreshes run in an order that measures the
      // lower one first. layout=dwell: the upper instance holds a Scene layer whose dwell depends on
      // the viewport, so it moves the lower instance's container; created after the lower one
      // (order=after) or unmounted and mounted again (order=remount). layout=max: the upper
      // instance's cover ends at 'max', which the lower instance's viewport-relative dwell moves,
      // and the upper one is created first.
      const params = new URLSearchParams(location.search);
      const layout = params.get('layout');
      const top = document.querySelector('.top');
      const bottom = document.querySelector('.bottom');
      // The lower instance's Scene layers: their dwell is fixed under layout=dwell and follows the
      // viewport under layout=max.
      const lowerEnd = layout === 'dwell' ? '+=200' : '+=50%';

      bottom.innerHTML = (layout === 'dwell' ? ['B1', 'B2', 'B3'] : ['B1', 'B2'])
        .map((label) => `<section>${label}</section>`)
        .join('');

      const lowerTriggers = () => {
        const sticky = new StickyScrollTrigger(bottom);
        const sections = [...bottom.children];

        if (params.has('cover')) {
          return [ScrollTrigger.create(sticky.createOverlapScroll({ trigger: sections[0] }))];
        }

        return sections.map((trigger) =>
          ScrollTrigger.create(sticky.createStickyTrigger({ trigger, end: lowerEnd })),
        );
      };
      let watched;

      if (layout === 'dwell') {
        top.innerHTML = '<div class="pin">PIN</div>';
        document.querySelector('.tail').style.height = '4000px';

        const upper = () => {
          const sticky = new StickyScrollTrigger(top);
          const trigger = ScrollTrigger.create(
            sticky.createStickyTrigger({ trigger: '.pin', end: '+=50%' }),
          );

          return { sticky, trigger };
        };

        if (params.get('order') === 'remount') {
          const first = upper();
          const lower = lowerTriggers();

          ScrollTrigger.refresh();
          first.trigger.kill();
          first.sticky.destroy();
          watched = [upper().trigger, ...lower];
        } else {
          const lower = lowerTriggers();

          watched = [upper().trigger, ...lower];
        }
      } else {
        top.innerHTML = '<section class="c1">C1</section><section>C2</section>';
        document.querySelector('.tail').style.height = '300px';

        const sticky = new StickyScrollTrigger(top);
        const cover = ScrollTrigger.create(
          sticky.createOverlapScroll({ trigger: '.c1', end: 'max' }),
        );

        watched = [cover, ...lowerTriggers()];
      }

      let refreshes = 0;

      ScrollTrigger.addEventListener('refresh', () => {
        refreshes += 1;
      });
      ScrollTrigger.refresh();

      // GSAP refreshes again on the window's load.
      if (document.readyState !== 'complete') {
        await new Promise((resolve) => window.addEventListener('load', resolve, { once: true }));
      }

      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

      window.__windows = () => watched.map((t) => [Math.round(t.start), Math.round(t.end)]);
      window.__refreshes = () => refreshes;
      window.__ScrollTrigger = ScrollTrigger;
      window.__ready = true;
    </script>
  </body>
</html>
