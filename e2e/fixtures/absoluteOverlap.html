<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>absoluteOverlap fixture</title>
    <style>
      body {
        margin: 0;
      }
      .tail {
        height: 400vh;
      }
      /* Fixed so a link is clickable at any scroll position, and out of the flow so it never
         shifts anything the spec measures. */
      nav {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9;
      }
    </style>
  </head>
  <body>
    <nav>
      <a id="link-early" href="#early">0</a>
      <a id="link-between" href="#between">1</a>
      <a id="link-after" href="#after">2</a>
    </nav>
    <div class="root">
      <div style="height: 700px"></div>
      <div id="early" style="height: 300px"></div>
      <section id="first" style="height: 500px"></section>
      <div id="between" style="height: 1500px"></div>
      <section id="second" style="height: 300px"></section>
      <div id="after" style="height: 400px"></div>
    </div>
    <div class="tail"></div>

    <script type="module">
      import StickyScrollTrigger from '../../src/index.ts';

      const root = document.querySelector('.root');
      const sticky = new StickyScrollTrigger(root);
      // #second's absolute start, 1500, falls inside #first's window, [1000, 2000].
      const scenes = [
        sticky.createStickyTrigger({ trigger: '#first', start: 'top top', end: '+=1000' }),
        sticky.createStickyTrigger({ trigger: '#second', start: 1500, end: '+=800' }),
      ];

      sticky.refresh();

      // The windows GSAP gets, the scroll ranges over which the page actually stands still, and
      // where resolveScrollPosition says each target arrives.
      window.__absoluteOverlap = () => {
        const windows = scenes.map((vars) => [vars.start(), vars.end()]);
        const resolved = Object.fromEntries(['early', 'between', 'after'].map((id) => [
          id,
          sticky.resolveScrollPosition(document.getElementById(id), 'top top'),
        ]));
        const probe = root.firstElementChild;
        const max = document.documentElement.scrollHeight - window.innerHeight;
        const stillRuns = [];
        let previous = null;
        let runStart = null;

        for (let scroll = 0; scroll <= max; scroll += 1) {
          window.scrollTo(0, scroll);

          const top = probe.getBoundingClientRect().top;

          if (previous !== null && top === previous) runStart ??= scroll - 1;
          else if (runStart !== null) {
            stillRuns.push([runStart, scroll - 1]);
            runStart = null;
          }

          previous = top;
        }

        window.scrollTo(0, 0);

        return { windows, stillRuns, resolved };
      };
    </script>
  </body>
</html>
