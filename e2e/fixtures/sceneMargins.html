<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>sceneMargins fixture</title>
    <style>
      body {
        margin: 0;
      }
      .tail {
        height: 400vh;
      }
    </style>
  </head>
  <body>
    <div class="before"></div>
    <div class="root"></div>
    <div class="tail"></div>

    <script type="module">
      import StickyScrollTrigger from '../../src/index.ts';

      const block = (height, id = '', style = '') =>
        `<section${id ? ` id="${id}"` : ''} style="height:${height}px;${style}">${id}</section>`;
      // Neither trigger is the last element: a plain footer ends the shared container.
      const twoScenes = (footerStyle) =>
        block(300) + block(200, 'first') + block(400) + block(200, 'second')
        + block(100, 'footer', footerStyle);

      // Each layout lists its scenes as [selector, end]; every scene starts at 'top top'.
      const layouts = {
        trailingMargin: {
          html: twoScenes('margin-bottom:16px'),
          scenes: [['#first', '+=300'], ['#second', '+=200']],
        },
        // With no dwell on the first scene, the margin held the second one instead.
        trailingMarginZeroDwell: {
          html: twoScenes('margin-bottom:16px'),
          scenes: [['#first', '+=0'], ['#second', '+=200']],
        },
        // The shared container's own margin collapsed out the same way.
        containerMargin: {
          root: 'margin-bottom:16px',
          html: twoScenes(''),
          scenes: [['#first', '+=300'], ['#second', '+=200']],
        },
        negativeTrailingMargin: {
          html: twoScenes('margin-bottom:-20px'),
          scenes: [['#first', '+=300'], ['#second', '+=200']],
        },
        // The previous sibling's bottom margin collapses with the first child's top margin.
        topMargin: {
          before: 'height:50px;margin-bottom:24px',
          html: block(300, 'lead', 'margin-top:16px') + block(200, 'first') + block(400),
          scenes: [['#first', '+=300']],
        },
      };
      const layout = layouts[new URLSearchParams(location.search).get('layout')];

      document.querySelector('.before').style.cssText = layout.before ?? '';

      const root = document.querySelector('.root');

      root.style.cssText = layout.root ?? '';
      root.innerHTML = layout.html;

      const documentTops = () =>
        Array.from(root.children, (el) => el.getBoundingClientRect().top + window.scrollY);
      const unwrappedTops = documentTops();
      const sticky = new StickyScrollTrigger(root);
      const scenes = layout.scenes.map(([trigger, end]) =>
        sticky.createStickyTrigger({ trigger, start: 'top top', end }));

      sticky.refresh();

      // The reported windows, the scroll ranges over which the page actually stands still, and the
      // document position of every root child at scroll 0, unwrapped and after refresh().
      window.__sceneMargins = () => {
        const windows = scenes.map((vars) => [vars.start(), vars.end()]);
        const probe = root.firstElementChild;
        const max = document.documentElement.scrollHeight - window.innerHeight;
        const stillRuns = [];
        let previous = null;
        let runStart = null;

        for (let scroll = 0; scroll <= max; scroll += 1) {
          window.scrollTo(0, scroll);

          const top = probe.getBoundingClientRect().top;

          if (previous !== null && top === previous) runStart ??= scroll - 1;
          else if (runStart !== null) {
            stillRuns.push([runStart, scroll - 1]);
            runStart = null;
          }

          previous = top;
        }

        window.scrollTo(0, 0);

        return { windows, stillRuns, unwrappedTops, tops: documentTops() };
      };
    </script>
  </body>
</html>
